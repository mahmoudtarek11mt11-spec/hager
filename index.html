<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e7,#ffc0cb);
    text-align:center;
    font-family:Arial;
}

.container{
    margin-top:50px;
    position:relative;
    z-index:2;
}

h1{
    color:#d10068;
    font-size:35px;
}

img{
    width:250px;
    border-radius:20px;
    margin:20px 0;
}

button{
    border:none;
    padding:15px 35px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
    position:relative;
}

#yesBtn{
    background:#2ecc71;
    color:white;
}

#noBtn{
    background:#e74c3c;
    color:white;
    position:absolute;
    margin-left:20px;
}

#finalPage{
    display:none;
}

#finalPage h2{
    color:#d10068;
    font-size:28px;
}

.heart{
    position:fixed;
    top:-20px;
    font-size:25px;
    animation:fall linear infinite;
    z-index:1;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}

</style>
</head>
<body>

<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<div class="container">

<h1>بحبك يا هاكر ممكن نرجع؟ ❤️</h1>

<img id="firstImage" src="first.png">

<br><br>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<div id="finalPage">

<h2>
معدش هعمل كدا تاني والله وعد ❤️<br><br>
انتي أحلي حاجة حصلت ليا ❤
</h2>

<img src="final.png">

</div>

</div>

<script>

let noBtn=document.getElementById("noBtn");
let yesBtn=document.getElementById("yesBtn");
let finalPage=document.getElementById("finalPage");

noBtn.addEventListener("mouseover",()=>{

let x=Math.random()*(window.innerWidth-150);
let y=Math.random()*(window.innerHeight-100);

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

});

yesBtn.addEventListener("click",()=>{

document.querySelector("h1").style.display="none";
document.getElementById("firstImage").style.display="none";
yesBtn.style.display="none";
noBtn.style.display="none";

finalPage.style.display="block";

});

function createHeart(){

let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
